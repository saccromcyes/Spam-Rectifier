[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spamrectifier"
version = "2.0.0"
description = "SMS spam detection: from-scratch Naive Bayes, embeddings classifier and LLM, benchmarked side by side."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aakarsh Dutt Sharma" }]
license = { text = "MIT" }
keywords = ["spam", "nlp", "classifier", "naive-bayes"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6", "fastembed>=0.9", "numpy>=2.0", "openai>=1.0"]

[project.scripts]
spamrectifier = "spamrectifier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905", "E501", "SIM905"]

