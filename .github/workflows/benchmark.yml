name: Benchmark

# Trains on the real embedding model, scores all three classifiers on the held-out set,
# and publishes results/benchmark.json (shown on the live Benchmark page) and the README table.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "data/**"]

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MODEL_CACHE_DIR: .cache/models
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-20b' }}
      LLM_MAX_RETRIES: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-bge-small
      - run: pip install -r requirements.txt
      - run: python -m spamrectifier.benchmark --llm-sample 150 --pause 7  # Groq free tier: ~8k tokens per minute
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results README.md
          git diff --cached --quiet || git commit -m "benchmark: refresh results"
          git push
